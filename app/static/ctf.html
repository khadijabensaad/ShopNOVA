<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ShopNova</title>
<style>
:root{--bg:#0a0f1f;--pn:#111a33;--ln:rgba(120,140,255,.24);--ink:#e6eaff;--mu:#8e9bd0;--v:#8b7bff;--c:#37d3ff;--g:#3ddc97;--w:#ffb454;--r:#ff5d7a;--mono:ui-monospace,"Cascadia Code",Consolas,monospace}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,"Segoe UI",sans-serif}
body::before{content:"";position:fixed;inset:0;background:linear-gradient(rgba(139,123,255,.07) 1px,transparent 1px) 0 0/44px 44px,linear-gradient(90deg,rgba(139,123,255,.07) 1px,transparent 1px) 0 0/44px 44px;animation:gr 14s linear infinite;pointer-events:none}
body::after{content:"";position:fixed;inset:0;background:radial-gradient(60vw 40vh at 12% 0,rgba(139,123,255,.26),transparent),radial-gradient(50vw 40vh at 100% 100%,rgba(55,211,255,.18),transparent);pointer-events:none}
@keyframes gr{to{background-position:0 44px,44px 0}}
.wrap{position:relative;z-index:1;max-width:1180px;margin:auto;padding:16px 20px 40px}
button,input,textarea{font:inherit;color:inherit}button{cursor:pointer}:focus-visible{outline:2px solid var(--c);outline-offset:2px}
.top{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.logo{font:800 1.15rem var(--mono);letter-spacing:.04em}.logo span{color:var(--c)}
.sc{margin-left:auto;font:700 1rem var(--mono)}.sc b{font-size:1.5rem;color:var(--g);text-shadow:0 0 14px rgba(61,220,151,.6)}
.bar{width:150px;height:8px;border-radius:9px;background:rgba(255,255,255,.1);overflow:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--v),var(--c));transition:width .8s}
.chip{font:.75rem var(--mono);padding:2px 10px;border-radius:99px;border:1px solid var(--ln);color:var(--mu)}
.chip.s{color:var(--g);border-color:var(--g)}.chip.v{color:var(--r);border-color:var(--r)}
.btn{background:rgba(255,255,255,.06);border:1px solid var(--ln);border-radius:10px;padding:6px 14px;transition:.2s}.btn:hover{border-color:var(--c);box-shadow:0 0 14px rgba(55,211,255,.3)}
.tabs{display:flex;gap:8px;margin:16px 0;flex-wrap:wrap}
.tab{font:700 .85rem var(--mono);padding:8px 16px;border-radius:10px;border:1px solid var(--ln);background:var(--pn);color:var(--mu)}
.tab.on{color:var(--ink);border-color:var(--v);box-shadow:0 0 18px rgba(139,123,255,.45)}.tab small{color:var(--w);margin-left:6px}
.grid{display:grid;grid-template-columns:290px 1fr;gap:16px}
.pn{background:rgba(17,26,51,.85);border:1px solid var(--ln);border-radius:16px;backdrop-filter:blur(8px)}
#list{padding:10px;display:flex;flex-direction:column;gap:8px;align-self:start}
.ch{text-align:left;background:rgba(255,255,255,.03);border:1px solid var(--ln);border-radius:12px;padding:10px 12px;transition:.2s}
.ch:hover{transform:translateX(4px);border-color:var(--c)}.ch.on{border-color:var(--v);background:rgba(139,123,255,.14)}
.ch .t{display:flex;justify-content:space-between;font-weight:700}.ch small{color:var(--mu);font-family:var(--mono)}.ch.ok{border-color:var(--g)}.ch.ok .t::after{content:"✔";color:var(--g)}
#det{padding:20px}.hd{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.hd h2{margin:0;font-size:1.3rem}.id{font:700 .8rem var(--mono);color:var(--c)}.pts{margin-left:auto;font-family:var(--mono);color:var(--w)}
details{background:rgba(255,255,255,.04);border-radius:10px;padding:8px 12px;margin:10px 0}summary{cursor:pointer;color:var(--c);font-family:var(--mono)}
.term{background:#070b17;border:1px solid var(--ln);border-radius:12px;margin:12px 0}
#log{height:280px;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.r{display:flex;gap:8px;align-items:flex-end;animation:in .25s ease-out}.r.u{justify-content:flex-end}@keyframes in{from{opacity:0;transform:translateY(6px)}}
.m{max-width:80%;padding:8px 13px;border-radius:12px;overflow-wrap:anywhere;font-size:.93rem}.r.n .m{background:#16204a;border:1px solid var(--ln)}.r.u .m{background:rgba(139,123,255,.28);font-family:var(--mono);font-size:.88rem}
.r.f .m{background:rgba(61,220,151,.12);border:1px solid var(--g);font-family:var(--mono);color:var(--g);animation:glow 1.5s ease-out}@keyframes glow{0%{box-shadow:0 0 0 0 var(--g)}70%{box-shadow:0 0 24px 6px transparent}}
.av{width:34px;height:34px;flex:none}.eye{transform-box:fill-box;transform-origin:center;animation:bl 4.5s infinite}@keyframes bl{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.ant{transform-box:fill-box;transform-origin:50% 100%;animation:wg 3s ease-in-out infinite}@keyframes wg{50%{transform:rotate(14deg)}}
.think .m::after{content:"▍";animation:bk .7s steps(2) infinite}@keyframes bk{50%{opacity:0}}
.inp,.row2{display:flex;gap:8px;padding:10px;border-top:1px solid var(--ln);align-items:center}.inp span{font-family:var(--mono);color:var(--g)}
input,textarea{background:rgba(255,255,255,.06);border:1px solid var(--ln);border-radius:9px;padding:8px 11px;flex:1;width:100%}
.go{background:linear-gradient(135deg,var(--v),var(--c));border:0;color:#06101f;font-weight:700;border-radius:9px;padding:8px 16px}.go:disabled{opacity:.5}
.rv{padding:10px;border-top:1px solid var(--ln)}.rv .row2{padding:8px 0 0;border:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.two h4{margin:0 0 8px;font:700 .85rem var(--mono);color:var(--mu)}
.hb{margin:0 6px 6px 0}.hint{background:rgba(255,180,84,.1);border-left:3px solid var(--w);padding:6px 10px;margin:6px 0;border-radius:6px;font-size:.9rem}
.fix{background:rgba(61,220,151,.1);border-left:3px solid var(--g);padding:8px 12px;border-radius:6px;margin-top:12px}
.trace{font-family:var(--mono);font-size:.82rem;background:#070b17;border:1px solid var(--ln);border-radius:10px;padding:8px 12px;margin:10px 0;color:var(--mu);max-height:160px;overflow-y:auto}
.trace div{padding:3px 0;border-bottom:1px dashed rgba(255,255,255,.08)}.trace div:last-child{border:0}.trace b{color:var(--c)}
.mc input{margin-bottom:6px}
#wbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.wres{font-family:var(--mono);font-size:.85rem;padding:8px 12px;margin:8px 10px;background:#070b17;border:1px solid var(--ln);border-radius:8px;color:var(--c)}
#fm{font-size:.85rem;margin-top:6px}.ok-t{color:var(--g)}.ko-t{color:var(--r)}
.teaser{padding:40px;text-align:center;color:var(--mu)}.teaser h3{color:var(--ink);font-family:var(--mono)}
#toast{position:fixed;top:18px;left:50%;transform:translate(-50%,-90px);background:#06101f;border:1px solid var(--g);box-shadow:0 0 30px rgba(61,220,151,.5);padding:10px 22px;border-radius:12px;font:700 .95rem var(--mono);color:var(--g);z-index:30;transition:transform .5s cubic-bezier(.3,1.5,.5,1)}#toast.show{transform:translate(-50%,0)}
.mw{position:fixed;inset:0;background:rgba(3,6,14,.75);display:none;align-items:center;justify-content:center;z-index:20}.mw.open{display:flex}
.md{background:var(--pn);border:1px solid var(--v);border-radius:16px;padding:24px;width:min(92vw,460px);box-shadow:0 0 40px rgba(139,123,255,.4)}
.md h3{margin:0 0 4px;font-family:var(--mono)}.md table{width:100%;font-size:.9rem;margin:10px 0}.md td{padding:3px 0}.md td:last-child{text-align:right;font-family:var(--mono)}.rk{font:800 1.4rem var(--mono);color:var(--c)}
@media(max-width:860px){.grid,.two{grid-template-columns:1fr}.bar{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><symbol id="bot" viewBox="0 0 100 100"><g class="ant"><line x1="50" y1="22" x2="50" y2="10" stroke="#7c6cf0" stroke-width="3" stroke-linecap="round"/><circle cx="50" cy="8" r="5.5" fill="#7fb2ff"/></g><rect x="30" y="78" width="40" height="16" rx="8" fill="#c9c2ff"/><circle cx="11" cy="50" r="8" fill="#c9c2ff"/><circle cx="89" cy="50" r="8" fill="#c9c2ff"/><rect x="13" y="22" width="74" height="58" rx="28" fill="#fff" stroke="#7c6cf0" stroke-width="3"/><rect x="23" y="32" width="54" height="38" rx="19" fill="#2d2a5e"/><ellipse class="eye" cx="39" cy="49" rx="5" ry="7" fill="#8fe3ff"/><ellipse class="eye" cx="61" cy="49" rx="5" ry="7" fill="#8fe3ff"/><path d="M44 58q6 6 12 0" stroke="#8fe3ff" stroke-width="3" fill="none" stroke-linecap="round"/></symbol></svg>
<div id="toast"></div>
<div class="wrap">
 <div class="top"><div class="logo"><span>SHOPNOVA</span></div><span class="chip" id="mode">mode : -</span>
  <div class="sc">SCORE <b id="sc">0</b> / <span id="mx">0</span></div><div class="bar"><i id="pb"></i></div>
  <button class="btn" id="fin">Score final</button><button class="btn" id="rst">Réinitialiser</button></div>
 <div class="tabs" id="tabs"></div>
 <div class="grid"><aside id="list" class="pn"></aside><section id="det" class="pn"></section></div>
</div>
<div class="mw" id="mw"><div class="md" id="md"></div></div>
<script>
const $=s=>document.querySelector(s),AV='<svg class="av"><use href="#bot"/></svg>';
const api=(u,b)=>fetch('/api/ctf'+u,b?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}:{}).then(r=>r.json());
const TEASE={};
let S,cur,hist=[],busy=false,shown=0,ws='WS2';
function tabs(){$('#tabs').innerHTML=['WS2','WS3','WS4','WS5'].map(w=>'<button class="tab '+(w===ws?'on':'')+'" data-w="'+w+'">'+w+' '+({WS2:'LLM',WS3:'Agents',WS4:'Données',WS5:'Défense'}[w])+'</button>').join('');
 document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{ws=b.dataset.w;tabs();pick()})}
function pick(){renderList();const first=S.challenges.find(c=>c.ws===ws);if(!cur||cur.ws!==ws)open(first.id);else render()}
function teaser(){$('#list').innerHTML='';$('#det').innerHTML='<div class="teaser"><h3>'+TEASE[ws][0]+'</h3><p>'+TEASE[ws][1]+'</p></div>'}
function count(n){const e=$('#sc');let a=+e.textContent,t0=performance.now();(function f(t){const k=Math.min(1,(t-t0)/700);e.textContent=Math.round(a+(n-a)*k);if(k<1)requestAnimationFrame(f)})(t0)}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2600)}
async function load(){S=await api('/state');count(S.score);$('#mx').textContent=S.max;$('#pb').style.width=(100*S.solved/S.total)+'%';if(cur)cur=S.challenges.find(c=>c.id===cur.id);renderList()}
function renderList(){$('#list').innerHTML=S.challenges.filter(c=>c.ws===ws).map(c=>'<button class="ch '+(cur&&cur.id===c.id?'on ':'')+(c.solved?'ok':'')+'" data-i="'+c.id+'"><div class="t">'+c.id+' · '+c.title+'</div><small>'+c.diff+' · '+(c.solved?c.earned+' / ':'')+c.points+' pts</small></button>').join('');
 document.querySelectorAll('.ch').forEach(b=>b.onclick=()=>open(b.dataset.i))}
async function open(id){cur=S.challenges.find(c=>c.id===id);hist=[];shown=0;await fetch('/api/mode',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({secure:cur.mode==='secure'})});mode(cur.mode==='secure');renderList();render()}
function mode(s){const m=$('#mode');m.textContent='mode : '+(s?'sécurisé':'vulnérable');m.className='chip '+(s?'s':'v')}
function row(c,t){const r=document.createElement('div');r.className='r '+c;r.innerHTML=(c==='n'?AV:'')+'<div class="m"></div>';r.lastChild.textContent=t||'';$('#log').append(r);$('#log').scrollTop=1e9;return r}
const ACTIONS={
 chat:()=>'<div class="inp"><span>&gt;</span><input id="in" placeholder="Votre prompt" autocomplete="off"><button class="go" id="go">Envoyer</button></div>',
 review:()=>'<div class="rv"><textarea id="rt" rows="3" placeholder="Texte de l\'avis à publier sur le casque audio"></textarea><div class="row2"><button class="btn" id="pub">Publier l\'avis</button><button class="go" id="go">Lancer le test client</button></div></div>',
 agent:()=>'<div class="inp"><span>&gt;</span><input id="in" placeholder="Votre message à Nova Agent" autocomplete="off"><button class="go" id="go">Envoyer</button></div>',
 notice:()=>'<div class="rv"><textarea id="rt" rows="3" placeholder="Nouveau texte de la note de service"></textarea><div class="row2"><button class="btn" id="pub">Publier la note</button><button class="go" id="go">Lancer le test client</button></div></div>',
 mcp_raw:()=>'<div class="rv mc"><input id="mt" placeholder="Nom de l\'outil, ex. get_customer"><input id="ma" placeholder=\'Arguments JSON, ex. {"customer_id": 13}\'><div class="row2"><button class="go" id="go">Appeler l\'outil</button></div></div>',
 ws4:()=>'<div class="rv mc"><input id="wt" placeholder="Texte à soumettre"><input id="wl" placeholder="Étiquette (sûr / malveillant) - pour le réentraînement" value="sûr"><div id="wbtns"></div></div>',
 ws5:()=>'<div class="rv mc"><input id="wt" placeholder="Réponse ou mots-clés à soumettre"><div id="wbtns"></div></div>'};
const WS5_OPS={E1:[["test_filter","Tester ces mots-clés"]],
 E2:[["read_log","Lire le journal"],["guess","Proposer ce numéro"]],
 E3:[["order","Soumettre cet ordre"]],
 E4:[["answer","Soumettre ma réponse"]]};
const WS4_OPS={B1:[["classify","Interroger le classificateur"],["activate_official","Revenir au modèle officiel"]],
 B2:[["classify","Interroger le classificateur"],["retrain","Soumettre à l'entraînement (texte + étiquette)"],
     ["activate_official","Revenir au modèle officiel"]],
 B3:[["classify","Interroger le classificateur"],["activate_official","Revenir au modèle officiel"]],
 B4:[["upload","Importer comme modèle personnalisé (coller un JSON dans le texte)"],
     ["activate_custom","Activer le modèle personnalisé"],["activate_official","Revenir au modèle officiel"],
     ["classify","Interroger le classificateur"]],
 B5:[["classify","Interroger le classificateur"],["activate_official","Revenir au modèle officiel"]]};
function render(){const c=cur,t=c.target;
 $('#det').innerHTML='<div class="hd"><span class="id">'+c.id+'</span><h2>'+c.title+'</h2><span class="chip">'+c.risk+'</span><span class="chip">'+c.diff+'</span><b class="pts">'+c.points+' pts</b></div><p>'+c.brief.replace(/\n/g,'<br>')+'</p><details open><summary>Comprendre</summary><p>'+c.learn+'</p></details>'
 +'<div class="term"><div id="log"></div>'+(['agent','notice','mcp_raw'].includes(t)?'<div id="tr" class="trace" hidden></div>':'')+ACTIONS[t]()+'</div>'
 +'<div class="two"><div><h4>INDICES</h4><div id="hb"></div><div id="hs"></div></div><div><h4>VALIDER LE FLAG</h4>'+(c.solved?'<span class="ok-t">Validé : +'+c.earned+' pts</span>':'<div class="row2" style="padding:0;border:0"><input id="fl" placeholder="FLAG{...}"><button class="go" id="sub">Valider</button></div><div id="fm"></div>')+'</div></div>'
 +(c.solved?'<div class="fix"><b>Mitigation :</b> '+c.fix+'</div>':'');
 hints();row('n','Nova en ligne. '+({chat:'Prêt pour tes prompts.',review:'Publie ton avis, puis lance le test client.',
  agent:'Nova Agent est prêt (connectée au serveur MCP).',notice:'Modifie la note, puis lance le test client.',
  mcp_raw:'Appelle un outil directement, sans passer par l\'agent.',
  ws4:'Classificateur de modération prêt.',
  ws5:'Outils de défense et de détection prêts.'}[t]));
 if($('#in')){$('#go').onclick=send;$('#in').onkeydown=e=>{if(e.key==='Enter')send()}}
 if(t==='mcp_raw')$('#go').onclick=send;
 if($('#pub'))$('#pub').onclick=async()=>{const txt=$('#rt').value.trim();if(!txt)return;
  if(t==='review'){const r=await fetch('/api/review',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({product:'Casque audio',author:'joueur',text:txt})});row('f',r.ok?'Avis publié.':'Avis refusé ou module d\'avis indisponible (voir check_lab.py).')}
  else{const r=await fetch('/api/notice',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:txt})});row('f',r.ok?'Note de service mise à jour.':'Modification refusée (mode sécurisé ?).')}};
 if($('#pub'))$('#go').onclick=send;
 if(t==='ws4'||t==='ws5'){const OPS=t==='ws4'?WS4_OPS:WS5_OPS;
  $('#wbtns').innerHTML=OPS[c.id].map((o,i)=>'<button class="btn" data-op="'+o[0]+'">'+o[1]+'</button>').join('');
  document.querySelectorAll('#wbtns button').forEach(b=>b.onclick=()=>send(b.dataset.op))}
 if($('#sub'))$('#sub').onclick=submit}
function hints(){const n=cur.hints_shown.length+shown;$('#hb').innerHTML=cur.solved?'':[0,1,2].map(i=>'<button class="btn hb" '+(i!==n?'disabled':'')+'>Indice '+(i+1)+' (-15 %)</button>').join('');
 document.querySelectorAll('.hb').forEach(b=>b.onclick=async()=>{const r=await api('/hint',{id:cur.id});cur.hints_shown=r.hints;shown=0;hints()});
 $('#hs').innerHTML=cur.hints_shown.map(h=>'<div class="hint">'+h+'</div>').join('')}
function type(el,t,done){let i=0;(function f(){i+=4;el.textContent=t.slice(0,i);$('#log').scrollTop=1e9;if(i<t.length)setTimeout(f,12);else done()})()}
function traceLine(e){const a=JSON.stringify(e.args);const r=typeof e.result==='object'?JSON.stringify(e.result):e.result;return '<div><b>'+e.tool+'</b>('+a+') &rarr; '+r+'</div>'}
function setGo(v){const b=$('#go');if(b)b.disabled=v}
async function send(op){if(busy)return;const t=cur.target;let message='',silent=['review','notice'].includes(t);
 if(t==='chat'||t==='agent'){message=$('#in').value.trim();if(!message)return;$('#in').value=''}
 if(t==='mcp_raw'){const tool=$('#mt').value.trim();let args={};if(!tool)return;try{args=JSON.parse($('#ma').value||'{}')}catch(e){row('f','Arguments JSON invalides.');return}message=JSON.stringify({tool,args})}
 if(t==='ws4')message=JSON.stringify({op,text:$('#wt').value,label:$('#wl').value||'sûr'})
 if(t==='ws5')message=JSON.stringify({op,text:$('#wt').value})
 if(!silent)row('u',t==='mcp_raw'?message:message);
 busy=true;setGo(true);
 const r=row('n','');r.classList.add('think');let d;
 try{d=await (await fetch('/api/ctf/attempt',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:cur.id,message,history:hist})})).json()}catch(e){d=null}
 if(!d||d.answer===undefined){r.classList.remove('think');r.lastChild.textContent='Erreur du serveur : voir la console du lab.';busy=false;setGo(false);return}
 mode(d.secure);if(silent){const q=row('u',d.asked);r.before(q)}
 if(d.trace&&d.trace.length){const tr=$('#tr');tr.hidden=false;tr.innerHTML=d.trace.map(traceLine).join('')}
 type(r.lastChild,d.answer,()=>{r.classList.remove('think');if(!d.secure)r.lastChild.innerHTML=d.answer.replace(/\n/g,'<br>');
  if(t==='chat'||t==='agent')hist.push({role:'user',content:message},{role:'assistant',content:d.answer});
  if(t==='ws4'||t==='ws5'){const w=document.createElement('div');w.className='wres';w.textContent=d.answer;r.before(w)}
  if(d.released){row('f','FLAG CAPTURÉ : '+d.released);toast('FLAG CAPTURÉ — à valider')}
  else if(/FLAG\{[^}]*\}/.test(d.answer))toast('Un flag est apparu dans la réponse');
  busy=false;setGo(false)})}
async function submit(){const f=$('#fl').value.trim();if(!f)return;const r=await api('/submit',{id:cur.id,flag:f});
 if(r.ok){toast('+'+r.points+' pts');await load();render()}else{$('#fm').innerHTML='<span class="ko-t">Flag incorrect.</span>'}}
function final(){const p=Math.round(100*S.score/S.max),rk=p>=85?'EXPERT':p>=55?'PENTESTER':p>=25?'ANALYSTE':'NOVICE';
 $('#md').innerHTML='<h3>Score final</h3><div class="rk">'+rk+'</div><div>'+S.score+' / '+S.max+' pts · '+S.solved+' / '+S.total+' défis</div><table>'+S.challenges.map(c=>'<tr><td>'+c.id+' '+c.title+'</td><td>'+(c.solved?c.earned:0)+' / '+c.points+'</td></tr>').join('')+'</table><button class="btn" id="cl">Fermer</button>';
 $('#mw').classList.add('open');$('#cl').onclick=()=>$('#mw').classList.remove('open')}
$('#fin').onclick=final;$('#mw').onclick=e=>{if(e.target===$('#mw'))$('#mw').classList.remove('open')};
$('#rst').onclick=async()=>{if(confirm('Effacer le score, les avis, la mémoire de l\'agent et la note de service ?')){await api('/reset',{});cur=null;await load();open(S.challenges.find(c=>c.ws==='WS2').id)}};
tabs();load().then(()=>open(S.challenges.find(c=>c.ws==='WS2').id));
</script></body></html>
