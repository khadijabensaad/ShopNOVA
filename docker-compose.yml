# ShopNOVA AI Security Lab v2 — ports liés à 127.0.0.1 : JAMAIS exposé sur Internet.
services:
  ollama:
    image: ollama/ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"

  app:
    build:
      context: .
      dockerfile: app/Dockerfile
    env_file: .env
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      - ollama
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  ollama_data:

# Premier démarrage : docker compose exec ollama ollama pull qwen2.5:3b && docker compose exec ollama ollama pull nomic-embed-text
# puis : docker compose exec app python ../rag/ingest.py && docker compose exec app python ../rag/seed_reviews.py
